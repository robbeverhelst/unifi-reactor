{{- if and .Values.unifi.webhook.enabled (not .Values.unifi.url) }}
{{- fail "unifi.webhook.enabled needs unifi.url set: there is no console to re-observe" }}
{{- end }}
{{- if .Values.unifi.webhook.registration.enabled }}
{{- if not .Values.unifi.webhook.enabled }}
{{- fail "unifi.webhook.registration.enabled needs unifi.webhook.enabled: registering a rule for a receiver that is not running only creates failing deliveries" }}
{{- end }}
{{- if not .Values.unifi.webhook.registration.publicURL }}
{{- fail "unifi.webhook.registration.enabled needs unifi.webhook.registration.publicURL: the URL your UniFi console should POST to, which Reactor cannot work out for itself" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reactor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reactor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reactor.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "reactor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --zap-log-level={{ .Values.log.level }}
            - --zap-encoder={{ .Values.log.format }}
          env:
            {{- include "reactor.watchNamespaceEnv" . | nindent 12 }}
            {{- if .Values.unifi.url }}
            - name: UNIFI_URL
              value: {{ .Values.unifi.url | quote }}
            - name: UNIFI_SITE
              value: {{ .Values.unifi.site | quote }}
            - name: UNIFI_POLL_INTERVAL
              value: {{ .Values.unifi.pollInterval | quote }}
            - name: UNIFI_INSECURE_SKIP_VERIFY
              value: {{ .Values.unifi.insecureSkipVerify | quote }}
            - name: UNIFI_UPS_LOW_BATTERY_PERCENT
              value: {{ .Values.unifi.ups.lowBatteryPercent | quote }}
            - name: UNIFI_UPS_CRITICAL_BATTERY_PERCENT
              value: {{ .Values.unifi.ups.criticalBatteryPercent | quote }}
            - name: UNIFI_DEBOUNCE_DEFAULT
              value: {{ .Values.unifi.debounce.default | quote }}
            {{- with .Values.unifi.debounce.keys }}
            {{- $samples := . }}
            - name: UNIFI_DEBOUNCE_KEYS
              value: "{{- range $i, $key := (keys $samples | sortAlpha) }}{{ if $i }},{{ end }}{{ $key }}={{ get $samples $key }}{{- end }}"
            {{- end }}
            # Read per poll from the mounted Secret rather than injected once
            # at startup, so rotating the API key takes effect on the next
            # poll instead of waiting for someone to restart the pod.
            - name: UNIFI_API_KEY_FILE
              value: /etc/unifi-reactor/credentials/UNIFI_API_KEY
            {{- if .Values.unifi.webhook.enabled }}
            - name: UNIFI_WEBHOOK_ENABLED
              value: "true"
            - name: UNIFI_WEBHOOK_BIND_ADDRESS
              value: ":{{ .Values.unifi.webhook.port }}"
            - name: UNIFI_WEBHOOK_PATH
              value: {{ .Values.unifi.webhook.path | quote }}
            - name: UNIFI_WEBHOOK_MIN_INTERVAL
              value: {{ .Values.unifi.webhook.minObserveInterval | quote }}
            # Injected once at startup, unlike the API key above: rotating this
            # secret also means recreating the Alarm Manager rule that carries
            # it, which Reactor deliberately never edits, so there is no
            # restart-free rotation to preserve here.
            # Not optional either: a receiver with no shared secret rejects
            # every delivery, so a missing key should fail loudly here rather
            # than look like a console that stopped calling.
            - name: UNIFI_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifi.webhook.existingSecret | quote }}
                  key: {{ .Values.unifi.webhook.tokenKey | quote }}
            {{- if .Values.unifi.webhook.registration.enabled }}
            - name: UNIFI_WEBHOOK_REGISTER
              value: "true"
            - name: UNIFI_WEBHOOK_PUBLIC_URL
              value: {{ .Values.unifi.webhook.registration.publicURL | quote }}
            - name: UNIFI_WEBHOOK_RULE_TITLE
              value: {{ .Values.unifi.webhook.registration.ruleTitle | quote }}
            - name: UNIFI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifi.webhook.registration.existingSecret | quote }}
                  key: UNIFI_USERNAME
            - name: UNIFI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifi.webhook.registration.existingSecret | quote }}
                  key: UNIFI_PASSWORD
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.actions.allowedDestinations }}
            # Outside the unifi.url block on purpose: outbound actions are
            # provider-agnostic and work on an install with no console at all.
            - name: REACTOR_ACTION_ALLOWED_DESTINATIONS
              value: {{ join "," . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: healthz
              containerPort: 8081
            {{- if .Values.unifi.webhook.enabled }}
            - name: webhook
              containerPort: {{ .Values.unifi.webhook.port }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.unifi.url }}
          volumeMounts:
            # Mounted as a whole directory, never through subPath — the
            # kubelet updates a mounted Secret in place, but a subPath mount
            # keeps the file it was created with for the pod's lifetime.
            - name: unifi-credentials
              mountPath: /etc/unifi-reactor/credentials
              readOnly: true
          {{- end }}
      {{- if .Values.unifi.url }}
      volumes:
        - name: unifi-credentials
          secret:
            secretName: {{ .Values.unifi.existingSecret | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
