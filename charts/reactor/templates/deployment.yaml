apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reactor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reactor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reactor.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "reactor.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          env:
            {{- if .Values.unifi.url }}
            - name: UNIFI_URL
              value: {{ .Values.unifi.url | quote }}
            - name: UNIFI_SITE
              value: {{ .Values.unifi.site | quote }}
            - name: UNIFI_POLL_INTERVAL
              value: {{ .Values.unifi.pollInterval | quote }}
            - name: UNIFI_INSECURE_SKIP_VERIFY
              value: {{ .Values.unifi.insecureSkipVerify | quote }}
            - name: UNIFI_UPS_LOW_BATTERY_PERCENT
              value: {{ .Values.unifi.ups.lowBatteryPercent | quote }}
            - name: UNIFI_UPS_CRITICAL_BATTERY_PERCENT
              value: {{ .Values.unifi.ups.criticalBatteryPercent | quote }}
            - name: UNIFI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.unifi.existingSecret | quote }}
                  key: UNIFI_API_KEY
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: healthz
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
