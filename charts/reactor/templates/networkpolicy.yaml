{{- if .Values.networkPolicy.enabled }}
# This pod holds a credential to your network infrastructure. The policy denies
# every inbound connection; egress is whatever networkPolicy.egress allows, and
# is unrestricted until you narrow it — see the chart README.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reactor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reactor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
