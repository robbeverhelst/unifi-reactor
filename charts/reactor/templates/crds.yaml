{{- /*
Generated by 'make manifests' from config/crd/bases — do not edit.

Templated rather than shipped in crds/, because Helm never upgrades the
latter. helm.sh/resource-policy: keep means an uninstall leaves the CRD
and your Automations in place; delete it by hand if you mean to.
*/}}
{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    helm.sh/resource-policy: keep
    controller-gen.kubebuilder.io/version: v0.21.0
  name: automations.reactor.robbeverhelst.com
spec:
  group: reactor.robbeverhelst.com
  names:
    kind: Automation
    listKind: AutomationList
    plural: automations
    singular: automation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.when.provider
      name: Provider
      type: string
    - jsonPath: .status.matching
      name: Matching
      type: boolean
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Automation reacts to provider state or events with declarative
          actions.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AutomationSpec defines the desired automation: the state condition to watch
              and the actions to run while it holds.

              v1alpha1 has one trigger kind. The event-shaped `spec.trigger` this schema
              used to accept was removed because nothing implemented it: no captured
              delivery payload exists to match against, and every action type is a
              desired-state action that is arbitrated continuously rather than fired on an
              occurrence. It returns in a later API version once both exist. Nothing about
              `when` changes when it does.
            properties:
              actions:
                description: Actions run while the state condition holds.
                items:
                  description: |-
                    Action is a single normalized action. Type selects the action provider;
                    the provider-specific fields are flat and validated per type.
                  properties:
                    replicas:
                      description: Replicas is the desired replica count for kubernetes.scale.
                      format: int32
                      minimum: 0
                      type: integer
                    target:
                      description: Target of a kubernetes.* action.
                      properties:
                        kind:
                          description: Kind of the target resource. Only "Deployment"
                            is supported in v1alpha1.
                          enum:
                          - Deployment
                          type: string
                        name:
                          description: Name of the target resource.
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace of the target resource. Defaults to the Automation's own
                            namespace. Cross-namespace targets require the controller to run with
                            cluster-wide RBAC; otherwise the Automation reports Ready=False.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    timeoutSeconds:
                      description: |-
                        TimeoutSeconds bounds a single attempt at this action, so an
                        unreachable target cannot occupy a reconcile indefinitely. Defaults to
                        30. Exceeding it is recorded as a failed execution and retried with
                        bounded backoff, not held open.
                      format: int32
                      maximum: 600
                      minimum: 1
                      type: integer
                    type:
                      description: Type of the action, e.g. "kubernetes.scale".
                      enum:
                      - kubernetes.scale
                      type: string
                  required:
                  - type
                  type: object
                minItems: 1
                type: array
              onExit:
                description: |-
                  OnExit declares what this Automation wants for its targets once its
                  condition stops holding. For desired-state actions this is a level that
                  is arbitrated against every other Automation sharing the target, not a
                  list executed on the exit edge: leaving the matching state does not
                  raise a target another Automation still holds down.
                items:
                  description: |-
                    Action is a single normalized action. Type selects the action provider;
                    the provider-specific fields are flat and validated per type.
                  properties:
                    replicas:
                      description: Replicas is the desired replica count for kubernetes.scale.
                      format: int32
                      minimum: 0
                      type: integer
                    target:
                      description: Target of a kubernetes.* action.
                      properties:
                        kind:
                          description: Kind of the target resource. Only "Deployment"
                            is supported in v1alpha1.
                          enum:
                          - Deployment
                          type: string
                        name:
                          description: Name of the target resource.
                          minLength: 1
                          type: string
                        namespace:
                          description: |-
                            Namespace of the target resource. Defaults to the Automation's own
                            namespace. Cross-namespace targets require the controller to run with
                            cluster-wide RBAC; otherwise the Automation reports Ready=False.
                          type: string
                      required:
                      - kind
                      - name
                      type: object
                    timeoutSeconds:
                      description: |-
                        TimeoutSeconds bounds a single attempt at this action, so an
                        unreachable target cannot occupy a reconcile indefinitely. Defaults to
                        30. Exceeding it is recorded as a failed execution and retried with
                        bounded backoff, not held open.
                      format: int32
                      maximum: 600
                      minimum: 1
                      type: integer
                    type:
                      description: Type of the action, e.g. "kubernetes.scale".
                      enum:
                      - kubernetes.scale
                      type: string
                  required:
                  - type
                  type: object
                type: array
              reversal:
                description: |-
                  Reversal selects what this Automation wants while its condition does not
                  hold. Defaults to Declared when spec.onExit is set, and to Baseline —
                  restore what the target was before Reactor first touched it — when it is
                  not. Set None to leave targets wherever they were left.
                enum:
                - Declared
                - Baseline
                - None
                type: string
              suspend:
                default: false
                description: |-
                  Suspend takes this Automation out of force without deleting it: it goes
                  on observing state and reporting it, and stops claiming its targets
                  entirely.

                  Suspending is a reversible delete, not a freeze. Targets are arbitrated
                  as if this Automation did not exist, so whatever it was holding down is
                  handed back to the other Automations claiming it — or, if none do, to
                  this Automation's own spec.reversal, exactly as deleting it would. Which
                  also means a suspended Automation writes nothing and can hold nothing
                  down: scale its targets by hand while you work.

                  Resuming re-evaluates against current state rather than replaying
                  anything, so an Automation whose condition still holds re-claims its
                  targets on the next reconcile.
                type: boolean
              when:
                description: 'When is a state trigger: active while the provider state
                  matches.'
                properties:
                  provider:
                    description: Provider is the event/state provider, e.g. "unifi".
                    minLength: 1
                    type: string
                  state:
                    additionalProperties:
                      type: string
                    description: |-
                      State is the provider-scoped key/value condition, e.g. {"wan": "backup"}.
                      All entries must match the observed state for the trigger to be active.
                    minProperties: 1
                    type: object
                required:
                - provider
                - state
                type: object
            required:
            - actions
            - when
            type: object
            x-kubernetes-validations:
            - message: 'spec.reversal: Declared requires spec.onExit'
              rule: '!has(self.reversal) || self.reversal != ''Declared'' || has(self.onExit)'
          status:
            description: AutomationStatus is the observed state of an Automation.
            properties:
              conditions:
                description: |-
                  Conditions represent the current service state. "Ready" reports whether
                  the Automation is valid and being reconciled; "Applied" reports whether
                  what it wants is what its targets actually have.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastExecution:
                description: |-
                  LastExecution is the outcome of the most recent action run, including
                  onExit runs (recorded for auditability).
                properties:
                  attempts:
                    description: |-
                      Attempts counts consecutive failures. Retries stop once the budget is
                      exhausted, leaving the Automation to recover on the next state change
                      rather than retrying a hopeless action forever.
                    format: int32
                    type: integer
                  onExit:
                    description: OnExit is true when this execution ran the onExit
                      actions.
                    type: boolean
                  reason:
                    description: Reason holds a human-readable error when Status is
                      "Failed".
                    type: string
                  status:
                    description: Status is "Success" or "Failed".
                    type: string
                  time:
                    description: Time is when execution finished.
                    format: date-time
                    type: string
                type: object
              lastTransition:
                description: LastTransition is the state change that last flipped
                  Matching.
                properties:
                  from:
                    description: From is the previous value.
                    type: string
                  key:
                    description: Key is the state key that transitioned, e.g. "wan".
                    type: string
                  time:
                    description: Time is when the transition was observed.
                    format: date-time
                    type: string
                  to:
                    description: To is the new value.
                    type: string
                type: object
              matching:
                description: Matching is true while a state trigger's condition currently
                  matches.
                type: boolean
              observedState:
                additionalProperties:
                  type: string
                description: |-
                  ObservedState is the provider state relevant to this Automation at the
                  last reconcile, e.g. {"wan": "backup"}.
                type: object
              releaseAttempts:
                description: |-
                  ReleaseAttempts counts how many times handing this Automation's targets
                  back has failed during deletion. Deletion gives up once it is exhausted
                  rather than leaving the resource stuck terminating.
                format: int32
                type: integer
              targets:
                description: |-
                  Targets reports the arbitrated outcome per target, explaining why an
                  Automation that wants something is not getting it.
                items:
                  description: |-
                    TargetStatus reports what this Automation wants for one target and what the
                    arbitration across every Automation sharing that target actually resolved
                    to. When the two differ, DeferredBy names who is holding it there.
                  properties:
                    deferredBy:
                      description: |-
                        DeferredBy names the Automations whose more restrictive claim is holding
                        the target away from Desired, as "namespace/name". Empty when this
                        Automation's intent is the one in effect.
                      items:
                        type: string
                      type: array
                    desired:
                      description: |-
                        Desired is the value this Automation alone wants right now, whether it
                        is currently matching or reversing. Absent when it wants nothing —
                        reversal None, or a reversal value it has no way to know.
                      format: int32
                      type: integer
                    effective:
                      description: |-
                        Effective is the value arbitration resolved to across every Automation
                        claiming this target. Absent while nothing claims it.
                      format: int32
                      type: integer
                    ref:
                      description: Ref is the target this entry describes, as "Kind/namespace/name".
                      type: string
                  required:
                  - ref
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
