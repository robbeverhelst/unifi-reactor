# Least-privilege RBAC in two modes (values.rbac.clusterWide):
#   cluster-wide:      ClusterRole/ClusterRoleBinding — Automations may target
#                      any namespace via spec.actions[].target.namespace.
#   namespace-scoped:  Role/RoleBinding in the release namespace — Automations
#                      only work in and target that namespace.
#
# A dry-run install is granted no verb that could change a target. --dry-run is
# the operator promising not to write; this is the API server holding it to that,
# which is the difference between "it should not touch your workloads" and "it
# cannot". Reads stay, because a dry run that could not read could not report.
{{- $objectVerbs := `["get", "patch"]` }}
{{- $scaleVerbs := `["get", "update"]` }}
{{- if .Values.safety.dryRun }}
{{- $objectVerbs = `["get"]` }}
{{- $scaleVerbs = `["get"]` }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.clusterWide }}
kind: ClusterRole
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
{{- else }}
kind: Role
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
{{- end }}
rules:
  - apiGroups: ["reactor.robbeverhelst.com"]
    resources: ["automations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["reactor.robbeverhelst.com"]
    resources: ["automations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["reactor.robbeverhelst.com"]
    resources: ["automations/finalizers"]
    verbs: ["update"]
  # The target kinds an Automation may name, and nothing else. Reactor reads a
  # target as an unstructured object through its uncached client, so a kind
  # costs "get" to read and "patch" to write it — no list, no watch, and no
  # informer holding every Deployment in the cluster in the operator's memory.
  #
  # This list and the target.kind enum in the CRD are the same decision written
  # twice: the enum is what turns an unsupported kind into a rejected write at
  # admission instead of a Forbidden at 3am. Adding a kind means adding it to
  # both.
  #
  # kubernetes.scale reads and writes a replica count through the scale
  # subresource, so a scalable kind is two rules: its own object, for the
  # annotations that record the baseline and the claim, and its /scale, for the
  # level. That split is what lets one executor serve every scalable kind
  # without knowing where any of them keeps its replicas.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: {{ $objectVerbs }}
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: {{ $scaleVerbs }}
  # kubernetes.cronjob.suspend. Suspending sets spec.suspend and nothing else:
  # this grants no permission over Jobs, so a Job already running is untouched
  # and untouchable, which is deliberate.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: {{ $objectVerbs }}
  # Events on the Automations themselves: every transition, every write to a
  # target, every action that failed. Automations live in the namespaces they
  # act on, so this follows the same scope as the rest of the manager's rules
  # rather than the release namespace only.
  #
  # events.k8s.io, not "". The manager records through the events.k8s.io/v1 API
  # — the two share storage but are separate API groups for authorization, so a
  # rule naming only "" is refused on every emission, logged by the broadcaster
  # and surfaced nowhere: the Automation simply has no Events, which reads as
  # nothing having happened. Leader election is the one thing here still using
  # the core/v1 recorder, and its own Role already grants it.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- if .Values.actions.allowedDestinations }}
  # Credentials for outbound actions live in Secrets in the namespace of the
  # Automation that references them, which is why this follows the manager's
  # scope rather than the release namespace.
  #
  # It is granted only when actions.allowedDestinations is set: with no
  # destination allowed there is no outbound action to authenticate, so an
  # install that does not use the feature never gives the operator read access
  # to Secrets at all. Reactor reads these with an uncached client, so no Secret
  # is held in the operator's memory beyond the request that used it.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.clusterWide }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "reactor.fullname" . }}-manager
{{- else }}
kind: RoleBinding
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "reactor.fullname" . }}-manager
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "reactor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.rbac.allowNodeActions }}
---
# kubernetes.cordon, and nothing else. Off unless rbac.allowNodeActions is set,
# because this is the one grant here that reaches outside the workloads Reactor
# was installed to manage.
#
# It is a ClusterRole in BOTH RBAC modes, and it has to be: Nodes are
# cluster-scoped, and a namespaced Role cannot grant access to them at all. So
# turning this on in a namespace-scoped install is a real widening of the
# operator's reach, not a formality — it is the reason this is a separate
# object with its own value rather than three more lines in the rule list above.
#
# What it does and does not permit:
#   - patch on nodes lets Reactor set spec.unschedulable and write its own
#     baseline and claim annotations. It also lets it write any other node
#     label or annotation, which is not a permission Kubernetes lets us split
#     more finely, and is the honest cost of this feature.
#   - It grants nothing over pods and nothing over pods/eviction, so Reactor
#     cannot drain a node however it is configured. That action is not
#     implemented, and this is the second lock on it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "reactor.fullname" . }}-node-actions
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: {{ $objectVerbs }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "reactor.fullname" . }}-node-actions
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "reactor.fullname" . }}-node-actions
subjects:
  - kind: ServiceAccount
    name: {{ include "reactor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# Leader election needs lease access in the release namespace in both modes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "reactor.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "reactor.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "reactor.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "reactor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
