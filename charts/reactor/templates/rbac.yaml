# Least-privilege RBAC in two modes (values.rbac.clusterWide):
#   cluster-wide:      ClusterRole/ClusterRoleBinding — Automations may target
#                      any namespace via spec.actions[].target.namespace.
#   namespace-scoped:  Role/RoleBinding in the release namespace — Automations
#                      only work in and target that namespace.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.clusterWide }}
kind: ClusterRole
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
{{- else }}
kind: Role
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
{{- end }}
rules:
  - apiGroups: ["reactor.robbeverhelst.com"]
    resources: ["automations"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["reactor.robbeverhelst.com"]
    resources: ["automations/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["reactor.robbeverhelst.com"]
    resources: ["automations/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # Events on the Automations themselves: every transition, every write to a
  # target, every action that failed. Automations live in the namespaces they
  # act on, so this follows the same scope as the rest of the manager's rules
  # rather than the release namespace only.
  #
  # events.k8s.io, not "". The manager records through the events.k8s.io/v1 API
  # — the two share storage but are separate API groups for authorization, so a
  # rule naming only "" is refused on every emission, logged by the broadcaster
  # and surfaced nowhere: the Automation simply has no Events, which reads as
  # nothing having happened. Leader election is the one thing here still using
  # the core/v1 recorder, and its own Role already grants it.
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
{{- if .Values.actions.allowedDestinations }}
  # Credentials for outbound actions live in Secrets in the namespace of the
  # Automation that references them, which is why this follows the manager's
  # scope rather than the release namespace.
  #
  # It is granted only when actions.allowedDestinations is set: with no
  # destination allowed there is no outbound action to authenticate, so an
  # install that does not use the feature never gives the operator read access
  # to Secrets at all. Reactor reads these with an uncached client, so no Secret
  # is held in the operator's memory beyond the request that used it.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.clusterWide }}
kind: ClusterRoleBinding
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "reactor.fullname" . }}-manager
{{- else }}
kind: RoleBinding
metadata:
  name: {{ include "reactor.fullname" . }}-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "reactor.fullname" . }}-manager
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "reactor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election needs lease access in the release namespace in both modes.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "reactor.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "reactor.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "reactor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "reactor.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "reactor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
