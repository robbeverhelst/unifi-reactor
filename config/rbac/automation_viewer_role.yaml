# This rule is not used by the project unifi-reactor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to reactor.robbeverhelst.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: unifi-reactor
    app.kubernetes.io/managed-by: kustomize
  name: automation-viewer-role
rules:
- apiGroups:
  - reactor.robbeverhelst.com
  resources:
  - automations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - reactor.robbeverhelst.com
  resources:
  - automations/status
  verbs:
  - get
