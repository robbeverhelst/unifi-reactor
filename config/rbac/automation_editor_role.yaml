# This rule is not used by the project unifi-reactor itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the reactor.robbeverhelst.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: unifi-reactor
    app.kubernetes.io/managed-by: kustomize
  name: automation-editor-role
rules:
- apiGroups:
  - reactor.robbeverhelst.com
  resources:
  - automations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - reactor.robbeverhelst.com
  resources:
  - automations/status
  verbs:
  - get
