name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  # Keyless signing: cosign exchanges this workflow's OIDC token for a
  # short-lived certificate, so there is no signing key to hold or leak.
  id-token: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the Artifact Hub changes annotation is
          # derived from the commits between this tag and the one before it,
          # and a shallow clone has neither.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Derive versions
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ github.ref_name }}
            ${{ steps.version.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and full build provenance, pushed alongside the image as
          # attestations, so what is in a release is a question with an answer.
          sbom: true
          provenance: mode=max

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Add the Artifact Hub changes annotation
        run: |
          # Written onto the runner's copy of Chart.yaml, never committed: it
          # describes one release, so a version of it in git would be stale the
          # moment the next tag is cut. A release with nothing to list is a
          # normal outcome and is not an error.
          ./hack/artifacthub-changes.sh --write "${GITHUB_REF_NAME}" \
            || echo "::warning::no artifacthub.io/changes annotation for ${GITHUB_REF_NAME}"
          # Whatever happened above, the chart must still parse — checked here,
          # before anything is published, rather than on Artifact Hub after.
          helm show chart charts/reactor > /dev/null

      - name: Package and push Helm chart (OCI)
        id: chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          helm package charts/reactor \
            --version "${VERSION}" \
            --app-version "${{ github.ref_name }}"
          helm push "reactor-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts" 2>&1 | tee push.log
          # helm prints the pushed manifest digest; cosign signs digests, never
          # tags, so that the signature cannot be moved to different content.
          digest="$(awk '/^Digest: /{print $2}' push.log)"
          test -n "${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the chart
        env:
          DIGEST: ${{ steps.chart.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: cosign sign --yes "ghcr.io/${OWNER}/charts/reactor@${DIGEST}"

      - name: Build install manifest
        run: make build-installer IMG=${{ steps.version.outputs.image }}:${{ github.ref_name }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/install.yaml
          generate_release_notes: true
