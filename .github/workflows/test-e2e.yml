name: E2E Tests

# These suites cost roughly 13 and 3 minutes because each one builds a Kind
# cluster, so a change that provably cannot reach the reaction flow should not
# pay for them. The list below is deliberately short: only the documentation
# site, Markdown anywhere, the two README banners and the licence. Everything
# else runs the suites, including hack/ (mock-unifi is the console the suites
# run against) and charts/ (the lifecycle suite installs the chart) — a false
# negative here ships a regression under a green tick, which is far worse than
# the minutes it saves.
#
# Skipping by path means the job does not run at all and reports no status.
# That is safe today because main has neither branch protection nor a ruleset,
# so none of these are required checks. If that changes, revisit this: a
# required check that never runs is reported as passing, and this filter would
# then let a docs pull request merge with a green Reaction that never executed.
# The fix in that case is a job that runs and reports success without doing the
# work, not an absent job.
#
# The two lists are identical and have to stay that way; Actions does not
# support YAML anchors, so they are written out twice.
on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/assets/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.github/assets/**'
      - 'LICENSE'

permissions: {}

jobs:
  # Each suite gets its own runner, and so its own throwaway Kind cluster: they
  # install cluster-wide RBAC and delete CRDs, which cannot be shared.
  e2e:
    permissions:
      contents: read
    name: ${{ matrix.name }}
    runs-on: arc-unifi-reactor
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Manager
            target: test-e2e
          - name: Reaction
            target: test-reaction
          - name: Lifecycle
            target: test-lifecycle
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The ARC runner image has no make; GitHub-hosted runners ship it.
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make

      # The reaction and lifecycle suites install the chart rather than the
      # kustomize manifests, so helm has to be there rather than merely likely.
      - name: Setup Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The suites shell out to kubectl; GitHub-hosted runners ship it, the ARC image does not.
      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0

      - name: Running Test e2e
        run: |
          go mod tidy
          make ${{ matrix.target }}
