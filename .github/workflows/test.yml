name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # The chart render tests skip themselves without it, which would hide the
      # packaging regressions they exist to catch.
      - name: Setup Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Running Tests
        run: |
          go mod tidy
          make test

      # make test regenerates manifests, the chart's CRD, and deepcopy code.
      # Anything it changes here was not committed.
      - name: Check generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output is out of date; run 'make manifests generate' and commit the result"
            git status --porcelain
            git diff
            exit 1
          fi
