name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The chart render tests skip themselves without it, which would hide the
      # packaging regressions they exist to catch.
      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Running Tests
        run: |
          go mod tidy
          make test

      # make test regenerates manifests, the chart's CRD, and deepcopy code.
      # Anything it changes here was not committed.
      - name: Check generated output is committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated output is out of date; run 'make manifests generate' and commit the result"
            git status --porcelain
            git diff
            exit 1
          fi

  # The published site is built by docs.yml, which runs only on push. Without
  # this job a docs-only dependency change merges green and breaks the deploy,
  # and nobody finds out because Pages keeps serving the last good build. That
  # happened: a Starlight 0.x minor landed in a "non-major" group needing an
  # Astro it did not have, and main deployed nothing for half an hour.
  #
  # Node is pinned to what withastro/action installs rather than left to the
  # runner's default, because Astro enforces an engine floor and the whole
  # point is to fail here rather than at deploy.
  site:
    permissions:
      contents: read
    name: Check the docs site builds
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install with the committed lockfile
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Build the site
        run: bun run build
        working-directory: docs

  # The site's Reference section is generated from the API types, the chart's
  # values, the metric definitions and the controller's Event reasons. Without
  # this job those pages rot the first time somebody adds a field in a hurry,
  # and a reference nobody has noticed is stale is worse than none, because
  # people trust it.
  docs:
    permissions:
      contents: read
    name: Check generated docs are committed
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Regenerate the Reference section
        run: make docs

      - name: Check generated docs are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The Reference section is out of date; run 'make docs' and commit the result"
            git status --porcelain
            git diff
            exit 1
          fi
