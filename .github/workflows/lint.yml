name: Lint

on:
  push:
    paths-ignore:
      - "*.md"
  pull_request:
    paths-ignore:
      - "*.md"

# PR runs cancel the one they supersede; main runs are per commit, so no release or deploy is cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The ARC runner image has no make; GitHub-hosted runners ship it.
      - name: Install make
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends make

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint

  # Bun ships a test runner, bundler, .env loading, YAML and password hashing,
  # so the npm packages it replaces stay out of docs/ and any later JS. This
  # fails when one is added, or when a lockfile other than bun.lock appears.
  bun-native:
    permissions:
      contents: read
    name: Check Bun-native dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Check Bun-native dependencies
        run: bun hack/check-bun-native.ts
